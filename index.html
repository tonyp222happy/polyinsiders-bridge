<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>WRAPPER_PENDING</title></head>
<body>
<script>
(async () => {
  const urls = [
    'https://api.polyinsiders.com/api/leaderboard/leaderboard?limit=10&daysBack=30&sortBy=totalPnl&minTrades=5',
    'https://api.polyinsiders.com/api/leaderboard/leaderboard?limit=5&daysBack=7&sortBy=totalPnl&minTrades=5'
  ];
  const out = [];
  for (const u of urls) {
    try {
      const r = await fetch(u, { headers: { 'Accept': 'application/json' } });
      const t = await r.text();
      out.push({ url: u, status: r.status, body: t });
    } catch (e) {
      out.push({ url: u, error: String(e) });
    }
  }
  document.title = 'WRAPPER_DONE';
  const pre = document.createElement('pre');
  pre.id = 'out';
  pre.textContent = JSON.stringify(out);
  document.body.appendChild(pre);
})();
</script>
</body>
</html>
